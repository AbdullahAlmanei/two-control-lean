name = "two-control-lean"
version = "0.1.0"
defaultTargets = ["TwoControl"]

[[lean_lib]]
name = "TwoControl"

# The Ross-Selinger circuit-synthesis engine is paused.  Its sources are still
# in the tree, but none of its four libraries are registered here:
#
#   RossSelinger.lean / RossSelinger/   the compiler itself
#   KMM.lean          / KMM/            exact synthesis over D[omega]
#   DyadicCyclotomic.lean / DyadicCyclotomic/   arithmetic support
#   MatrixCompletion.lean / MatrixCompletion/   unitary-completion support
#
# Registering a library and merely leaving it out of `defaultTargets` does not
# work: `leanblueprint checkdecls` imports the root module of every `lean_lib`
# in this package, so a registered-but-unbuilt library makes the blueprint CI
# job fail with "object file ... does not exist" before it checks a single
# declaration.  Nothing under `TwoControl/` imports any of the four, so leaving
# them unregistered costs the built library nothing.
#
# To resume the work, add back:
#
#     [[lean_lib]]
#     name = "DyadicCyclotomic"
#
#     [[lean_lib]]
#     name = "MatrixCompletion"
#
#     [[lean_lib]]
#     name = "RossSelinger"
#
#     [[lean_lib]]
#     name = "KMM"
#
# and add them to `defaultTargets` (or to the CI build step) so that they are
# built wherever `checkdecls` runs.


[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"

[[require]]
name = "«doc-gen4»"
git = "https://github.com/leanprover/doc-gen4"
rev = "main"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
